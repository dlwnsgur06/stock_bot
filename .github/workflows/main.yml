name: Righthand Stock Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scanner_alert.py

      - name: Save data
        run: |
          git config user.name "Righthand Bot"
          git config user.email "righthand-bot@users.noreply.github.com"

          git add alert_history.json holdings.json telegram_update_id.txt

          git diff --cached --quiet || git commit -m "Update bot data"

          git pull --rebase origin main

          git push origin main
