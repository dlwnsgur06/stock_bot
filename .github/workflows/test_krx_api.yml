import os
import requests
import time

API_KEY = os.getenv("DATA_GO_KR_SERVICE_KEY")

print()
print("==============================")
print("공공데이터포털 KRX API 연결 테스트")
print("==============================")

if not API_KEY:
    print("DATA_GO_KR_SERVICE_KEY가 없습니다.")
    raise SystemExit(1)

url = (
    "https://apis.data.go.kr/"
    "1160100/service/GetKrxListedInfoService/"
    "getItemInfo"
)

params = {
    "serviceKey": API_KEY,
    "numOfRows": 10,
    "pageNo": 1,
    "resultType": "json"
}

success = False

for attempt in range(1, 4):

    print()
    print(f"{attempt}/3회 API 요청 중...")

    try:
        response = requests.get(
            url,
            params=params,
            timeout=60
        )

        print(f"HTTP 상태 코드 : {response.status_code}")
        print(f"응답 길이 : {len(response.text)}")
        print()
        print("응답 앞부분:")
        print(response.text[:500])

        if response.ok:
            success = True
            break

    except requests.exceptions.Timeout:
        print("요청 시간 초과")

    except requests.exceptions.RequestException as e:
        print(f"네트워크 오류 : {e}")

    if attempt < 3:
        print("30초 후 재시도합니다.")
        time.sleep(30)

if not success:
    print()
    print("==============================")
    print("KRX API 연결 실패")
    print("==============================")
    raise SystemExit(1)

print()
print("==============================")
print("KRX API 연결 성공")
print("==============================")
